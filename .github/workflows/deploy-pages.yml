# Single production path: push to main → build with secrets → deploy to GitHub Pages.
# Repo Settings → Pages → Source: GitHub Actions (required once).

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        env:
          VITE_LEAD_FORM_ACTION: ${{ secrets.VITE_LEAD_FORM_ACTION }}
          VITE_LEAD_FORM_EMAIL_FIELD: ${{ secrets.VITE_LEAD_FORM_EMAIL_FIELD }}
          VITE_LEAD_FORM_PRIVACY_FIELD: ${{ secrets.VITE_LEAD_FORM_PRIVACY_FIELD }}
          VITE_LEAD_FORM_PRIVACY_VALUE: ${{ secrets.VITE_LEAD_FORM_PRIVACY_VALUE }}
          VITE_LEAD_FORM_PROFILE_FIELD: ${{ secrets.VITE_LEAD_FORM_PROFILE_FIELD }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
